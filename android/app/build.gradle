plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.kamremake.android'
    compileSdk 36
    ndkVersion '29.0.13599879'

    defaultConfig {
        applicationId 'org.kamremake.android'
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv('KAM_VERSION_CODE') ?: '2').toInteger()
        versionName = System.getenv('KAM_VERSION_NAME') ?: '1.0.1-r16435'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cFlags '-Wall' } }
    }

    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (System.getenv('KAM_KEYSTORE_FILE')) {
                storeFile file(System.getenv('KAM_KEYSTORE_FILE'))
                storePassword System.getenv('KAM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KAM_KEY_ALIAS')
                keyPassword System.getenv('KAM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            // R8: shrink and obfuscate Java/Kotlin code, drop unused resources
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('KAM_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
        // Kotlin metadata pulled in by libVLC is not needed at runtime
        resources { excludes += ['kotlin/**', '**/*.kotlin_builtins', 'META-INF/*.version', 'META-INF/*.kotlin_module'] }
    }

    // Optional: bundle the game data into the APK (-Pkam.bundleData=true), extracted on first launch.
    // build_apk.sh prepares build/bundle/kamdata with links to the KaM Remake data folders
    if (project.hasProperty('kam.bundleData') && project.property('kam.bundleData') == 'true') {
        sourceSets { main { assets.srcDirs += "${rootDir}/build/bundle" } }
    }
    androidResources {
        // Already compressed game files are stored as is; maps, scripts, WAV etc. are deflated (lossless)
        noCompress 'rxx', 'rxa', 'avi', 'mp4', 'mp2', 'mp3', 'ogg', 'png', 'pdf'
        // libVLC assets not used by the game: Lua playlist/meta scripts, HRTF data
        ignoreAssetsPattern '!lua:!hrtfs:!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    // Same video engine as the Windows version of KaM Remake (VLC), plays the original AVI intros
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
